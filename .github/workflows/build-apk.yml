# يبني ملف APK لتطبيق «مقابلة» تلقائياً مع كل تحديث للكود
name: بناء APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: muqabala_flutter
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: توليد ملفات أندرويد
        run: flutter create . --org iq.muqabala --project-name muqabala --platforms android

      - name: اسم التطبيق بالعربي
        run: sed -i 's/android:label="muqabala"/android:label="مقابلة"/' android/app/src/main/AndroidManifest.xml

      - name: إيقاف فحص lint اللي يتعطل وقت البناء
        run: |
          cat >> android/build.gradle.kts <<'KTS'

          subprojects {
              tasks.matching { it.name.startsWith("lintVital") }.configureEach { enabled = false }
          }
          KTS

      - name: المكتبات والأيقونة
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: فحص الكود
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: بناء APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/muqabala.apk

      - uses: actions/upload-artifact@v4
        with:
          name: muqabala-apk
          path: muqabala_flutter/build/app/outputs/flutter-apk/app-release.apk

      - name: نشر الـAPK كإصدار للتنزيل المباشر
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: مقابلة – آخر نسخة APK
          make_latest: true
          body: |
            آخر نسخة تجريبية من تطبيق «مقابلة».
            نزّل ملف muqabala.apk من الأسفل وافتحه بالتلفون حتى يتنصّب.
            حسابات التجربة (كلمة المرور 123456): موظف 07701111111، موظفة 07703333333، شركة 07900000000، موارد بشرية 07000000000 (مدير) و07000000001 (مراجع) و07000000002 (دعم)، ورمز التحقق بخطوتين للموارد البشرية 4321.
          files: muqabala_flutter/build/app/outputs/flutter-apk/muqabala.apk
