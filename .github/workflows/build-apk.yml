# يبني ملف APK لتطبيق «مقابلة» تلقائياً مع كل تحديث للكود
name: بناء APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: muqabala_flutter
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: توليد ملفات أندرويد
        run: flutter create . --org iq.muqabala --project-name muqabala --platforms android

      - name: اسم التطبيق بالعربي
        run: sed -i 's/android:label="muqabala"/android:label="مقابلة"/' android/app/src/main/AndroidManifest.xml

      - name: المكتبات والأيقونة
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: فحص الكود
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: بناء APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: muqabala-apk
          path: muqabala_flutter/build/app/outputs/flutter-apk/app-release.apk
